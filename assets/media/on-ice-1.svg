<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f9ff"/><stop offset=".55" stop-color="#d3e8fb"/><stop offset="1" stop-color="#b7d6f2"/>
    </linearGradient>
    <linearGradient id="boards" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdff"/><stop offset=".8" stop-color="#eef3f9"/><stop offset="1" stop-color="#d9e4ee"/>
    </linearGradient>
  </defs>

  <!-- call window -->
  <rect width="900" height="620" fill="#1e1f26"/>

  <!-- main tile: coach camera, ice rink -->
  <g>
    <rect x="40" y="40" width="820" height="460" rx="14" fill="url(#boards)"/>
    <rect x="40" y="52" width="820" height="448" rx="10" fill="url(#ice)"/>
    <!-- rink markings -->
    <line x1="40" y1="270" x2="860" y2="270" stroke="#3b6fd4" stroke-width="10" stroke-opacity=".55"/>
    <circle cx="450" cy="270" r="86" fill="none" stroke="#d24d4d" stroke-width="8" stroke-opacity=".5"/>
    <circle cx="450" cy="270" r="14" fill="#d24d4d" fill-opacity=".5"/>
    <line x1="40" y1="120" x2="860" y2="120" stroke="#3b6fd4" stroke-width="8" stroke-opacity=".4"/>
    <!-- speed streaks -->
    <path d="M120 320 H 330 M110 356 H 300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <!-- coach: back view, pink COACH hoodie, gliding -->
    <g transform="translate(430 250)">
      <ellipse cx="0" cy="150" rx="70" ry="12" fill="#8fb4d9" opacity=".5"/>
      <path d="M-36 -8 C -66 -22, -86 -40, -102 -58" stroke="#ec4899" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path d="M36 -8 C 66 -22, 86 -40, 102 -58" stroke="#ec4899" stroke-width="15" stroke-linecap="round" fill="none"/>
      <circle cx="-106" cy="-62" r="9" fill="#edb98a"/>
      <circle cx="106" cy="-62" r="9" fill="#edb98a"/>
      <rect x="-38" y="-14" width="76" height="86" rx="24" fill="#ec4899"/>
      <text x="0" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">COACH</text>
      <circle cx="0" cy="-38" r="24" fill="#edb98a"/>
      <path d="M-24 -44 a24 24 0 0 1 48 0" fill="#3a2b28"/>
      <circle cx="14" cy="-58" r="10" fill="#3a2b28"/>
      <path d="M-16 72 L -22 122 M16 72 L 22 122" stroke="#23252d" stroke-width="16" stroke-linecap="round"/>
      <path d="M-26 128 H 0 M6 128 H 30" stroke="#cfd6df" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- self view: student -->
  <g>
    <rect x="646" y="66" width="196" height="134" rx="10" fill="url(#ice)"/>
    <rect x="646" y="66" width="196" height="134" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <g transform="translate(744 128)">
      <circle cx="0" cy="-16" r="13" fill="#edb98a"/>
      <path d="M-13 -20 a13 13 0 0 1 26 0" fill="#5a3d2b"/>
      <rect x="-16" y="-4" width="32" height="42" rx="12" fill="#2e3140"/>
      <path d="M-10 38 L -12 54 M10 38 L 12 54" stroke="#23252d" stroke-width="9" stroke-linecap="round"/>
    </g>
    <rect x="656" y="76" width="72" height="22" rx="6" fill="#000000" opacity=".45"/>
    <text x="692" y="91" text-anchor="middle" font-size="12" fill="#ffffff">Student</text>
  </g>

  <!-- name chip -->
  <rect x="56" y="56" width="110" height="24" rx="6" fill="#000000" opacity=".45"/>
  <text x="111" y="72" text-anchor="middle" font-size="12" fill="#ffffff">Iren · Coach</text>

  <!-- call control bar -->
  <g transform="translate(330 522)">
    <rect width="240" height="52" rx="26" fill="#26282f"/>
    <g transform="translate(38 26)" fill="#d5d7de">
      <rect x="-5" y="-9" width="10" height="18" rx="5"/>
      <path d="M-10 -2 a10 10 0 0 0 20 0" fill="none" stroke="#d5d7de" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="13" stroke="#d5d7de" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(104 26)">
      <rect x="-11" y="-8" width="16" height="16" rx="4" fill="#d5d7de"/>
      <path d="M5 -2 L 12 -6 V 6 L 5 2 Z" fill="#d5d7de"/>
    </g>
    <g transform="translate(170 26)">
      <rect x="-24" y="-13" width="48" height="26" rx="13" fill="#e74c4c"/>
      <rect x="-8" y="-6" width="10" height="12" rx="2" fill="#ffffff" transform="rotate(35 0 0)"/>
      <rect x="-4" y="-10" width="10" height="20" rx="2" fill="#ffffff" transform="rotate(35 0 0)"/>
    </g>
  </g>
</svg>
